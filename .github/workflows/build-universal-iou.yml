name: Build Universal IOU 1.21.10
on:
  push:
    branches: [build-universal-iou]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unzip source and build
        shell: bash
        run: |
          mkdir -p iou-project
          unzip -q source/universal-iou.zip -d iou-project
          cd iou-project/universal-iou
          gradle --no-daemon build --stacktrace
      - name: Upload ready-to-install Fabric mod
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Universal-IOU-Fabric-1.21.10
          path: iou-project/universal-iou/build/libs/universal-iou-1.0.0.jar
          if-no-files-found: error
