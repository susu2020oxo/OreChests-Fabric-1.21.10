name: Build Universal IOU 1.21.10
on:
  push:
    branches: [build-universal-iou]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unzip, patch for Minecraft 1.21.10 and compile
        shell: bash
        run: |
          mkdir -p iou-project
          unzip -q source/universal-iou.zip -d iou-project
          cd iou-project/universal-iou
          sed -i '/^import net.minecraft.item.EnchantedBookItem;$/d' src/main/java/com/example/universaliou/AbilityEvents.java
          sed -i 's/EnchantedBookItem.forEnchantment(new EnchantmentLevelEntry(soulSpeed, 3))/new ItemStack(Items.ENCHANTED_BOOK)/' src/main/java/com/example/universaliou/AbilityEvents.java
          sed -i 's/registry.getEntry(key)/registry.getEntry(key.getValue())/' src/main/java/com/example/universaliou/BorrowEvents.java
          sed -i 's/enchantments.getEntry(Enchantments.SOUL_SPEED)/enchantments.getEntry(Enchantments.SOUL_SPEED.getValue())/' src/main/java/com/example/universaliou/AbilityEvents.java
          gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Universal-IOU-Fabric-1.21.10
          path: iou-project/universal-iou/build/libs/universal-iou-1.0.0.jar
          if-no-files-found: error
