name: Build Ore Chests Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore complete mod project
        run: |
          rm -rf src build.gradle gradle.properties settings.gradle README.md LICENSE build.bat
          cat source_parts/part*.b64 | base64 --decode > orechests-mod-source.tar.gz
          tar -xzf orechests-mod-source.tar.gz
          rm -rf source_parts orechests-mod-source.tar.gz

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: OreChests-Fabric-1.21.10-v1.1.0
          path: |
            build/libs/orechests-1.1.0.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
