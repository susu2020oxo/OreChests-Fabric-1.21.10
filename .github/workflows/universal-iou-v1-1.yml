name: Universal IOU 1.21.10 v1.1 Build
on:
  push:
    branches: [universal-iou-v1-1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Fabric mod
        shell: bash
        run: |
          mkdir -p iou-project
          unzip -q source/universal-iou.zip -d iou-project
          cd iou-project/universal-iou
          sed -i 's/mod_version=1.0.0/mod_version=1.1.0/' gradle.properties
          gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Universal-IOU-v1.1-Fabric-1.21.10
          path: iou-project/universal-iou/build/libs/universal-iou-1.1.0.jar
          if-no-files-found: error
