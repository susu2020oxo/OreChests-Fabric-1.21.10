plugins { id 'fabric-loom' version '1.13.6' }
version = '1.0.0'
group = 'cn.diamondworld'
base { archivesName = 'diamond-world-1.21.10' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.10'
 mappings 'net.fabricmc:yarn:1.21.10+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.17.3'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
loom {
 runs {
  server {
   if (project.hasProperty('verifyWorld')) vmArg '-Ddiamondworld.verify=true'
   programArg 'nogui'
  }
  client {
   if (project.hasProperty('previewWorld')) {
    vmArg '-Ddiamondworld.preview=true'
    programArgs '--quickPlaySingleplayer', 'DiamondWorldPreview'
   }
  }
 }
}
